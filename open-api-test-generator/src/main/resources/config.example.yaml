# Примерная конфигурация

# Где приложение хранит локальные артефакты.
output:
  save-llm-input: false
  dir: "output"

model:
  name: "Qwen 3.6"
  base-url: "http://10.8.0.11:1234"
  model-name: "qwen/qwen3.6-35b-a3"
  temperature: 0.7

# Промпты, которые отправляются в LLM.
start-text:
  api-swagger: "Тут будет промпт, который принимает распарсенный Swagger-контракт и генерирует по нему тест-кейсы"
  postman-prompt: "Тут будет системный промпт для генерации Postman-коллекции"
  selenium-prompt: "Тут будет системный промпт для генерации selenium"
